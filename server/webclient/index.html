<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Ninja Online</title>
<meta name="apple-mobile-web-app-title" content="Ninja Online">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; justify-content: center; align-items: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  #msg { position: fixed; left: 0; right: 0; bottom: 10%; text-align: center; color: #fff; font: 16px Arial, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="msg">Loading…</div>
<script src="engine.js"></script>
<script src="stage.js"></script>
<script src="lua.js"></script>
<script src="luabind.js"></script>
<script src="gamebind.js"></script>
<script src="net.js"></script>
<script src="data.js"></script>
<script src="bag.js"></script>
<script src="team.js"></script>
<script src="train.js"></script>
<script src="fight.js"></script>
<script src="game.js"></script>
<script src="shop.js"></script>
<script src="spar.js"></script>
<script src="upgrade.js"></script>
<script src="arena.js"></script>
<script src="tower.js"></script>
<script src="plunder.js"></script>
<script src="details.js"></script>
<script src="base.js"></script>
<script src="growth.js"></script>
<script src="social.js"></script>
<script src="war.js"></script>
<script src="book.js"></script>
<script src="extras.js"></script>
<script src="sound.js"></script>
<script src="luascreens.js"></script>
<script src="custom.js"></script>
<script src="fit.js"></script>
<script>
  // makes the game installable as an app (Chrome / Edge "Install", a phone's "Add to Home Screen"); sw.js keeps no copies of game files
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
