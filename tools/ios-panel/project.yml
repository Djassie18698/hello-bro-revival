# XcodeGen project for Ninja Panel (the control panel as an iPhone app). The Mac on GitHub turns this into an Xcode project and builds an
# unsigned .ipa (.github/workflows/ios-panel.yml); Sideloadly signs it with your own Apple ID when it installs it.
name: NinjaPanel
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  NinjaPanel:
    type: application
    platform: iOS
    sources:
      - path: NinjaPanel
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: NinjaPanel
        PRODUCT_BUNDLE_IDENTIFIER: com.ninjaonlinereborn.panel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NinjaPanel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
